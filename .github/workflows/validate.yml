name: Validate 21 cm laboratory

on:
  push:
    branches: [main, velocity-conventions-validation-v2, dashboard-ui-provenance-v1, fits-ingestion-provenance-v1, phase-space-viewport-rebuild-v2]
  pull_request:

permissions:
  contents: read

jobs:
  model-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Python linter
        run: python -m pip install ruff==0.16.6
      - name: Lint Python validation code
        run: ruff check tools
      - name: Parse browser sources
        run: |
          node --check assets/js/fits-import.js
          node --check assets/js/app.js
          node --check assets/js/physicsWorker.js
          node --check tools/validate_browser_contract.js
          node --check tools/validate_fits_import.js
          node --check tools/validate_reference_dashboard_contract.js
      - name: Validate browser physics contract
        run: node tools/validate_browser_contract.js
      - name: Validate FITS import contract
        run: node tools/validate_fits_import.js
      - name: Validate current dashboard evidence boundary
        run: node tools/validate_reference_dashboard_contract.js
      - name: Validate frozen observational assets
        run: python tools/validate_observations.py
      - name: Validate peak sensitivity and distance geometry
        run: python tools/validate_peak_sensitivity.py
      - name: Generate deterministic synthetic tables
        run: python tools/generate_21cm_spectrum.py
      - name: Validate physical model checks
        run: python tools/validate_model.py
      - name: Validate spectral velocity conventions
        run: python tools/validate_velocity_conventions.py
      - name: Validate observed-spectrum CSV contract
        run: python tools/validate_import_contract.py
      - name: Validate independent science contract
        run: python tools/validate_science_contract.py
