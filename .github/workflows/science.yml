name: Science validation

on:
  pull_request:
  push:
    branches: [main, science-validation-contract-v1]

jobs:
  science:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Generate synthetic spectrum
        run: python tools/generate_21cm_spectrum.py
      - name: Validate existing model checks
        run: python tools/validate_model.py
      - name: Validate independent science contract
        run: python tools/validate_science_contract.py
      - name: Validate observational integrity
        run: python tools/validate_observations.py
      - name: Validate peak sensitivity
        run: python tools/validate_peak_sensitivity.py
